<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume | Akash</title>
    <meta name="description" content="View Akash's resume in-browser.">
    <link rel="icon" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="resume-viewer-container">
        <div class="glass resume-viewer-card">
            <div class="viewer-header">
                <div>
                    <h1 style="margin:0; font-size:clamp(1.8rem,4vw,2.4rem);">View Resume</h1>
                    <p style="margin:.5rem 0 0; color:var(--text-muted);">Open the resume directly in your browser.</p>
                </div>
                <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                    <a href="index.html" class="btn btn-secondary">← Back to Portfolio</a>
                    <a href="resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Open PDF in New Tab</a>
                </div>
            </div>
            <div class="resume-frame">
                <iframe src="resume.pdf#toolbar=1" title="Akash Resume"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
